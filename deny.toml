# SPDX-License-Identifier: Apache-2.0

# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The Marvin attack recovers an RSA private key from the timing of
    # operations with it. This tool holds no RSA private key: `rsa` only
    # verifies RS256 passkey signatures over public data, for contract
    # approvals (decision 0017). Revisit if any RSA private-key operation
    # is ever added.
    { id = "RUSTSEC-2023-0071", reason = "verification with public keys only; no RSA private key is used (docs/decisions/0017)" },
]

[licenses]
version = 2
# Permissive licenses compatible with this project's Apache-2.0 license. Additions are a
# reviewed decision, not a convenience.
# BSD-3-Clause: the dalek Ed25519 crates. It asks binary distributions to
# reproduce its copyright notice, which a release process must do.
# Zlib and Apache-2.0 WITH LLVM-exception: the Cedar policy engine's graph
# (foldhash, linked; ar_archive_writer, build time only). ADR 0016.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are unpublished but licensed; check them too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The tool is synchronous and local-first. A network or async runtime, a TLS
# stack or an embedded database entering the graph is an architecture change
# and needs a decision record first (docs/decisions/0002).
deny = [
    { crate = "tokio" },
    { crate = "async-std" },
    { crate = "smol" },
    { crate = "hyper" },
    { crate = "reqwest" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "rustls" },
    { crate = "openssl" },
    { crate = "native-tls" },
    { crate = "rusqlite" },
    { crate = "sqlx" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
