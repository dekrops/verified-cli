# SPDX-License-Identifier: Apache-2.0

# cargo-deny configuration for the fuzz targets, which are their own
# workspace. Run from the repository root:
#   cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check
#
# It is ../deny.toml with one more license, NCSA. Nothing here is linked into the
# tool or distributed with it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# NCSA: libFuzzer, as packaged by libfuzzer-sys. Allowed for the fuzz targets
# only (docs/decisions/0014-fuzzing.md).
# Zlib and Apache-2.0 WITH LLVM-exception: the Cedar policy engine's graph, as in
# ../deny.toml (docs/decisions/0016-derivation-replay.md).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
