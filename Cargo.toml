# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/dekrops/verified-cli"
license = "Apache-2.0"
# Nothing is published to a registry without explicit authorization.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
verified-canonical = { path = "crates/verified-canonical", version = "0.1.5" }
verified-contract = { path = "crates/verified-contract", version = "0.1.5" }
verified-derivation = { path = "crates/verified-derivation", version = "0.1.5" }
verified-history = { path = "crates/verified-history", version = "0.1.5" }
verified-protocol = { path = "crates/verified-protocol", version = "0.1.5" }
verified-verifier = { path = "crates/verified-verifier", version = "0.1.5" }
verified-work-unit = { path = "crates/verified-work-unit", version = "0.1.5" }
verified-workspace = { path = "crates/verified-workspace", version = "0.1.5" }

anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
base64 = "0.23.1"
# The engine release the first implementation's Java binding is built on. Exact: a result is
# reproducible against one Cedar language version only (ADR 0016).
cedar-policy = "=4.10.0"
clap = { version = "4.6.7", features = ["derive"] }
hmac = "0.13.0"
ed25519-dalek = { version = "3.0.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding", "sha2"] }
proptest = "1.11.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.1"
