[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/dekrops/verified-cli"
# No `license` field yet: the Apache-2.0 target is subject to IP approval
# (see LICENSE and docs/protocol/publication-review.md).
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
verified-canonical = { path = "crates/verified-canonical", version = "0.1.0" }
verified-protocol = { path = "crates/verified-protocol", version = "0.1.0" }
verified-verifier = { path = "crates/verified-verifier", version = "0.1.0" }

anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.11.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
