# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain and its components are pinned by rust-toolchain.toml;
      # rustup, preinstalled on the runners, installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The corpus tests skip here; the conformance job runs them.
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked

  conformance:
    name: reproduces the published conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The corpus is public and is not copied into this repository. It is
      # pinned to a commit so that a change upstream cannot change this
      # result unseen; moving the pin is a reviewed change, made together
      # with docs/protocol/compatibility.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dekrops/wvp
          ref: c7c9de2a7e8ad67e7dcee46d5c5f7fc2edccb797
          path: wvp
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # REQUIRED turns a missing corpus into a failure, so this job cannot
      # pass by skipping.
      - run: cargo test --workspace --locked -- --nocapture
        env:
          VERIFIED_CONFORMANCE_DIR: ${{ github.workspace }}/wvp/test-vectors
          VERIFIED_CONFORMANCE_REQUIRED: "1"

  supply-chain:
    name: advisories, licenses, bans, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  offline:
    name: builds and tests without network access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fetch --locked
      - run: cargo build --workspace --tests --locked --offline
      # A fresh network namespace has no interfaces but loopback: any attempt
      # by the tool or its tests to reach the network fails.
      # sudo looks commands up on its own secure path, so the user's PATH is
      # handed to env instead.
      - run: >
          sudo unshare --net --
          sudo -u "$(id -un)"
          env "PATH=$PATH" "HOME=$HOME"
          cargo test --workspace --locked --offline
