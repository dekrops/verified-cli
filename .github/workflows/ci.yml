# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Whether anything but documentation changed. A pull request that only
  # touches the files below runs no build, test or corpus: the jobs that
  # are required checks still report, as skipped, which branch protection
  # accepts. A push to main always runs everything. Files a test or a CI
  # job reads (README.md, examples/**, THIRD-PARTY-LICENSES.md) are code
  # here.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            for file in $(git diff --name-only "$BASE" "$HEAD"); do
              case "$file" in
                docs/*|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md) ;;
                *) code=true ;;
              esac
            done
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Anything but documentation changed: $code"

  check:
    name: fmt, clippy, test, doc (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Skipped step by step, not as a job: a skipped matrix job would report
    # under its unexpanded name and leave the per-platform required checks
    # waiting.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      # The toolchain and its components are pinned by rust-toolchain.toml;
      # rustup, preinstalled on the runners, installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.code == 'true'
      - run: cargo fmt --all -- --check
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: needs.changes.outputs.code == 'true'
      # The corpus tests skip here; the conformance job runs them.
      - run: cargo test --workspace --locked --no-fail-fast
        if: needs.changes.outputs.code == 'true'
      - run: cargo doc --workspace --no-deps --locked
        if: needs.changes.outputs.code == 'true'

  conformance:
    name: reproduces the published conformance corpus
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The corpus is public and is not copied into this repository. It is
      # pinned to a commit so that a change upstream cannot change this
      # result unseen; moving the pin is a reviewed change, made together
      # with docs/protocol/compatibility.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dekrops/wvp
          ref: c7c9de2a7e8ad67e7dcee46d5c5f7fc2edccb797
          path: wvp
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # REQUIRED turns a missing corpus into a failure, so this job cannot
      # pass by skipping.
      - run: cargo test --workspace --locked -- --nocapture
        env:
          VERIFIED_CONFORMANCE_DIR: ${{ github.workspace }}/wvp/test-vectors
          VERIFIED_CONFORMANCE_REQUIRED: "1"

  semver:
    name: library API is compatible with the last tag
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history, for the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-semver-checks --version 0.51.0 --locked
      # The five library crates follow semantic versioning from v0.1.0
      # (docs/development/compatibility-policy.md). A breaking change passes
      # only together with the version bump it needs; see
      # docs/development/releasing.md.
      - name: Compare with the last tag
        run: |
          baseline=$(git describe --tags --abbrev=0 --match 'v*')
          echo "Comparing with $baseline"
          cargo semver-checks --baseline-rev "$baseline" \
            -p verified-canonical -p verified-protocol -p verified-contract \
            -p verified-verifier -p verified-work-unit

  notices:
    name: third-party notices match Cargo.lock
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-about --version 0.9.2 --features cli --locked
      # A binary distribution must carry these texts (NOTICE). The file is
      # generated, offline, from the crates Cargo.lock names; a change of
      # dependencies regenerates it in the same pull request.
      - run: cargo fetch --locked
      - run: cargo about generate --frozen --fail about.hbs -o "$RUNNER_TEMP/notices.md"
      - name: The committed file is current
        run: |
          diff -u THIRD-PARTY-LICENSES.md "$RUNNER_TEMP/notices.md" || {
            echo "::error::THIRD-PARTY-LICENSES.md is out of date: run cargo about generate --frozen --fail about.hbs -o THIRD-PARTY-LICENSES.md"
            exit 1
          }

  supply-chain:
    name: advisories, licenses, bans, sources
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  offline:
    name: builds and tests without network access
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fetch --locked
      - run: cargo build --workspace --tests --locked --offline
      # A fresh network namespace has no interfaces but loopback: any attempt
      # by the tool or its tests to reach the network fails.
      # sudo looks commands up on its own secure path, so the user's PATH is
      # handed to env instead.
      - run: >
          sudo unshare --net --
          sudo -u "$(id -un)"
          env "PATH=$PATH" "HOME=$HOME"
          cargo test --workspace --locked --offline
