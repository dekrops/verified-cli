[package]
name = "verified-cli"
description = "Git-like tools for verifiable work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
# Signing a decision with a local key: the key is wiped from memory when
# dropped.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
serde_json.workspace = true
verified-canonical.workspace = true
verified-protocol.workspace = true
verified-derivation.workspace = true
verified-history.workspace = true
verified-verifier.workspace = true
verified-work-unit.workspace = true
verified-workspace.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "verified"
path = "src/main.rs"

[lints]
workspace = true
