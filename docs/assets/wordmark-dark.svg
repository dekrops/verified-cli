<svg xmlns="http://www.w3.org/2000/svg" width="340" height="96" viewBox="0 0 340 96" role="img" aria-labelledby="title">
  <title id="title">verified: Git-like tools for verifiable work</title>
  <!-- A run of linked records, as a commit graph draws one. The last is
       open: nothing is known after it. For dark backgrounds. -->
  <path d="M14 48 H74" fill="none" stroke="#f0f6fc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="14" cy="48" r="9" fill="#f0f6fc"/>
  <circle cx="44" cy="48" r="9" fill="#f0f6fc"/>
  <circle cx="74" cy="48" r="9" fill="#0d1117" stroke="#f0f6fc" stroke-width="5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="40">
    <text x="104" y="62" fill="#9198a1">$</text>
    <text x="136" y="62" fill="#f0f6fc" font-weight="700">verified</text>
  </g>
</svg>
